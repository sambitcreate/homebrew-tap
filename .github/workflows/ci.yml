name: Tap CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Register checked-out tap
        run: brew tap --custom-remote sambitcreate/tap "$GITHUB_WORKSPACE"

      - name: Validate tap
        run: |
          brew readall sambitcreate/tap
          brew style --cask sambitcreate/tap/aiden-agent
          brew audit --strict --online --cask sambitcreate/tap/aiden-agent
          brew fetch --cask sambitcreate/tap/aiden-agent
