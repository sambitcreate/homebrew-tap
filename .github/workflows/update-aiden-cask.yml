name: Update Aiden cask

on:
  workflow_dispatch:
  schedule:
    # Cross-repository GITHUB_TOKENs cannot dispatch this workflow. Poll often
    # enough that a verified Aiden release reaches Homebrew without a manual PR.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: update-aiden-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update cask from the latest Aiden release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-aiden-cask.sh

      - name: Detect update
        id: update
        run: |
          if git diff --quiet -- Casks/aiden-agent.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Register checked-out tap
        if: steps.update.outputs.changed == 'true'
        run: |
          brew tap --custom-remote sambitcreate/tap "$GITHUB_WORKSPACE"
          tap_repository="$(brew --repository sambitcreate/tap)"
          cp "$GITHUB_WORKSPACE/Casks/aiden-agent.rb" "$tap_repository/Casks/aiden-agent.rb"
          cmp -s "$GITHUB_WORKSPACE/Casks/aiden-agent.rb" "$tap_repository/Casks/aiden-agent.rb"

      - name: Validate update
        if: steps.update.outputs.changed == 'true'
        run: |
          brew readall sambitcreate/tap
          brew style --cask sambitcreate/tap/aiden-agent
          brew audit --strict --online --cask sambitcreate/tap/aiden-agent
          brew fetch --cask sambitcreate/tap/aiden-agent

      - name: Publish verified cask update
        if: steps.update.outputs.changed == 'true'
        run: |
          version="$(ruby -e 'puts File.read("Casks/aiden-agent.rb")[/^\s*version "([^"]+)"$/, 1]' )"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/aiden-agent.rb
          git diff --cached --check
          git commit -m "aiden-agent ${version}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
